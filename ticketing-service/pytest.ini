[pytest]
# Pytest configuration for RAVETURE Ticketing Service

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum version
minversion = 7.0

# Add options
addopts =
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    -l
    # Enable verbose output
    -v
    # Show print statements
    -s
    # Stop on first failure (useful for debugging, comment out for CI)
    # -x
    # Show coverage report
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # Coverage thresholds
    --cov-fail-under=80
    # Warnings
    --strict-markers
    --strict-config
    # Parallel execution (comment out for debugging)
    -n auto

# Markers for organizing tests
markers =
    unit: Unit tests that test individual functions/methods in isolation
    integration: Integration tests that test multiple components together
    smoke: Quick smoke tests for critical functionality
    slow: Tests that take longer to run
    tickets: Ticket type and ticket generation tests
    orders: Order creation, confirmation, cancellation tests
    qr: QR code generation and validation tests
    discounts: Discount code tests
    timers: Tests involving time-based logic (expiration, rotation)
    security: Security-related tests (HMAC, API keys, rate limiting)
    audit: Audit logging tests
    stats: Statistics and analytics tests
    pdf: PDF generation tests
    resale: Resale marketplace tests
    api: API endpoint tests
    race: Race condition and concurrency tests

# Filter warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage configuration
[coverage:run]
source = app
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */migrations/*
    */config.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
